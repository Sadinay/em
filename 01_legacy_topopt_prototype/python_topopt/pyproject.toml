[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-topopt-pure-python"
version = "0.1.0"
description = "Pure-Python historical CLONALG compatibility layer for the FEMM motor topology project"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "h5py>=3.10",
  "PyYAML>=6.0",
  "shapely>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
femm = ["pyfemm==0.1.3"]
ml = ["torch>=2.2", "matplotlib>=3.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
